# Run `forge register` before the first deploy. Never reuse either source app ID.
app:
  id: ari:cloud:ecosystem::app/1d49ae3f-e976-438c-893c-806c8b249351
  runtime:
    name: nodejs22.x
modules:
  objectStore:
    - key: fos
      storageClass: standard
  consumer:
    - key: va-restore-consumer
      queue: va-restore-queue
      function: restore-worker
    - key: confl-reconcile-cnsmr
      queue: confluence-reconcile
      function: confl-reconcile-wrk
    - key: va-vault-consumer
      queue: va-vault-queue
      function: vault-worker
    - key: va-link-consumer
      queue: va-link-queue
      function: link-worker
  sql:
    - key: main
      engine: mysql
  llm:
    - key: va-llm
      model: [ claude ]
  jira:issuePanel:
    - key: va-panel
      icon: https://developer.atlassian.com/platform/forge/images/issue-panel-icon.svg
      resource: main-ui
      resolver:
        function: panel-resolver
      title: VAtlassian
  jira:issueContext:
    - key: va-context
      resource: main-ui
      resolver:
        function: panel-resolver
      title: VAtlassian
      label: Baseline status
      dynamicProperties:
        function: issue-status
  jira:globalPage:
    - key: va-worklist
      resource: main-ui
      resolver:
        function: panel-resolver
      title: My approvals
      layout: blank
  jira:personalSettingsPage:
    - key: va-authenticator
      resource: main-ui
      resolver:
        function: totp-resolver
      title: VAtlassian authenticator
  jira:workflowValidator:
    - key: va-gate
      name: VAtlassian Approval
      # ONE VALIDATOR, ATTACHED TO EVERY TRANSITION. It holds a baselined work
      # item whose content has changed since approval on every transition until
      # that change is approved or reverted, and asks for a signature only on
      # the transitions VAtlassian administration controls. There is no second
      # Jira rule to attach. See src/gate.js.
      description: Attach to every transition. Holds a work item with unreviewed
        changes since approval, and requires an eligible approval at the
        configured assurance level on transitions VAtlassian controls.
      function: gate
      projectTypes: [ company-managed ]
      configurationDescription:
        expression: "'VAtlassian approval: ' + (config['configuredIn'] == 'admin' ?
          'Configured in VAtlassian' : 'Holds drifted work items; signature
          rules are set in VAtlassian administration')"
      resolver:
        function: admin-resolver
      create:
        resource: main-ui
      edit:
        resource: main-ui
      view:
        resource: main-ui
  jira:customField:
    - key: va-approval-field
      name: Electronic Signature
      description: Confirm this transition in the VAtlassian approval form. Never
        enter an authenticator code in a plain Jira text field.
      type: string
      resolver:
        function: panel-resolver
      view:
        resource: ui-kit-approval-view
        render: native
        experience: [ issue-view ]
        formatter:
          expression: "value == null || value == '' ? 'Not approved' : 'Approval recorded
            — see the VAtlassian panel'"
          export: true
      edit:
        resource: ui-kit-approval-edit
        render: native
        experience: [ issue-transition ]

    # THE SECOND FIELD IS NOT A DUPLICATE. The field above is UI Kit, which
    # renders declaratively on Atlassian's side and has no DOM, no `window`
    # and no `navigator` — `navigator.credentials.get()` cannot be called
    # from it, so it can never serve an edge whose required assurance is
    # BIOMETRIC. This one is Custom UI, runs in an iframe, and can open the
    # ceremony popup (see the permissions note further down).
    #
    # An administrator puts whichever field matches the assurance that
    # transition requires on its screen. This one reads the requirement and
    # serves every level, so it is the safe choice for a screen shared by
    # several rules; the UI Kit field above is left exactly as it is so the
    # authenticator-code path already in use is not disturbed.
    - key: va-device-approval-field
      name: Biometric Authentication
      description: Signing form for controlled transitions, including biometric
        device checks. Put this on the transition screen for any rule whose
        required assurance is Biometric approval.
      type: string
      resolver:
        function: panel-resolver
      view:
        resource: ui-kit-approval-view
        render: native
        experience: [ issue-view ]
        formatter:
          expression: "value == null || value == '' ? 'Not approved' : 'Approval recorded
            — see the VAtlassian panel'"
          export: true
      edit:
        resource: main-ui
        experience: [ issue-transition ]
  jira:adminPage:
    - key: va-admin
      resource: main-ui
      resolver:
        function: admin-resolver
      title: VAtlassian
      layout: blank
      sections:
        - header: Setup
          pages:
            - title: Administrators
              route: admins
            - title: Approver roles
              route: roles
            - title: Controlled transitions
              route: transitions
            - title: Controlled fields
              route: fields
        - header: Evidence
          pages:
            - title: Audit ledger
              route: ledger
            - title: Export & retention
              route: retention
            - title: Content changes
              route: content-review
        - header: Operations
          pages:
            - title: Settings
              route: settings
            - title: Credentials & recovery
              route: credentials
            - title: Control health
              route: health
    - key: va-admin-configure
      resource: main-ui
      resolver:
        function: admin-resolver
      title: VAtlassian configuration
      useAsConfig: true
  trigger:
    - key: va-on-issue-updated
      function: on-issue-updated
      events: [ avi:jira:updated:issue ]
    - key: va-on-issue-transitioned
      function: on-issue-transitioned
      events: [ avi:jira:transitioned:issue ]
    - key: va-on-issue-created
      function: on-issue-created
      events: [ avi:jira:created:issue ]

    - key: va-on-issue-deleted
      function: on-issue-deleted
      events: [ avi:jira:deleted:issue ]
    - key: va-on-issue-link
      function: on-issue-link
      events: [ avi:jira:created:issuelink, avi:jira:deleted:issuelink ]
    - key: va-on-confluence-event
      function: on-confluence-event
      events:
        - avi:confluence:created:page
        - avi:confluence:updated:page
        - avi:confluence:deleted:page
        - avi:confluence:archived:page
        - avi:confluence:restored:page
        - avi:confluence:trashed:page
        - avi:confluence:created:blogpost
        - avi:confluence:updated:blogpost
        - avi:confluence:deleted:blogpost
        - avi:confluence:archived:blogpost
        - avi:confluence:restored:blogpost
        - avi:confluence:trashed:blogpost
        - avi:confluence:created:attachment
        - avi:confluence:updated:attachment
        - avi:confluence:deleted:attachment
  # TEMPORARY live probe for the attachment design (src/jobs/probe.js).
  # Read-only, guarded by the encrypted PROBE_SECRET variable. Remove when done.
  webtrigger:
    - key: va-probe
      function: probe
  scheduledTrigger:
    - key: trigger-five-minute
      function: runner-five-minute
      interval: fiveMinute
    - key: trigger-hourly
      function: runner-hourly
      interval: hour
    - key: trigger-daily
      function: runner-daily
      interval: day
  confluence:contentBylineItem:
    - key: confluence-byline
      resource: main-ui
      resolver:
        function: panel-resolver
      title: VAtlassian Status
  confluence:pageBanner:
    - key: confluence-banner
      resource: main-ui
      resolver:
        function: panel-resolver
      title: VAtlassian
  confluence:contentAction:
    - key: confluence-action
      resource: main-ui
      resolver:
        function: panel-resolver
      title: VAtlassian Protect
  confluence:globalPage:
    - key: confluence-global
      resource: main-ui
      resolver:
        function: panel-resolver
      title: VAtlassian Approvals
      route: approvals
  confluence:spaceSettings:
    - key: confluence-space
      resource: main-ui
      resolver:
        function: panel-resolver
      title: VAtlassian Space Setup
      route: setup
  confluence:contentProperty:
    - key: confluence-property
      propertyKey: va-property
      name:
        value: VAtlassian Property
      values:
        - path: value
          type: string
  function:
    - key: probe
      handler: jobs/probe.handler
    - key: restore-worker
      handler: jobs/restoreWorker.handler
      timeoutSeconds: 600
      # Whole attachment files are held in memory while they are hashed and
      # copied (lib/vaultObjectStore.js MAX_VAULT_BYTES is set against this).
      runtime:
        memoryMB: 1024
    - key: vault-worker
      handler: jobs/vaultWorker.handler
      timeoutSeconds: 600
      # Whole attachment files are held in memory while they are hashed and
      # copied (lib/vaultObjectStore.js MAX_VAULT_BYTES is set against this).
      runtime:
        memoryMB: 1024
    - key: link-worker
      handler: jobs/linkWorker.handler
      timeoutSeconds: 600
    - key: confl-reconcile-wrk
      handler: jobs/confluenceReconcile.handler
      timeoutSeconds: 600
    - key: issue-status
      handler: resolvers/issueStatus.handler
    - key: panel-resolver
      handler: resolvers/panel.handler
    - key: admin-resolver
      handler: resolvers/admin.handler
    - key: totp-resolver
      handler: resolvers/totp.handler
    - key: gate
      handler: gate.validate
    - key: on-issue-updated
      handler: triggers/issue-updated.run
    - key: on-issue-transitioned
      handler: triggers/issue-transitioned.run
    - key: on-issue-created
      handler: triggers/issue-created.run

    - key: on-issue-deleted
      handler: triggers/issue-deleted.run
    - key: on-issue-link
      handler: triggers/issue-link.run
    - key: on-confluence-event
      handler: triggers/confluence-event.run
    - key: runner-five-minute
      handler: jobs/runner.runFiveMinute
    - key: runner-hourly
      handler: jobs/runner.runHourly
    - key: runner-daily
      handler: jobs/runner.runDaily
resources:
  - key: main-ui
    path: frontend/dist
  - key: ui-kit-approval-view
    path: src/ui-kit/view.jsx
  - key: ui-kit-approval-edit
    path: src/ui-kit/edit.jsx
permissions:
  # THIS BLOCK FORFEITS RUNS ON ATLASSIAN. It is here for one reason: biometric
  # approval needs navigator.credentials.get(), which a Forge Custom UI iframe
  # cannot call unless the parent page delegates `publickey-credentials-get`,
  # and Jira does not. The ceremony therefore runs in a top-level popup, and
  # popups from Forge iframes are sandbox-blocked by default. Declaring
  # `external.fetch.client` is the only documented way to get `allow-popups`
  # and `allow-popups-to-escape-sandbox` onto the iframe sandbox attribute, and
  # `"*"` is the form that recipe specifies.
  #
  # THE APP STILL MAKES NO EGRESS CALLS. Nothing here fetches an external
  # domain; this is a CSP connect-src declaration kept only for the sandbox
  # side effect. Eligibility looks at the presence of the block, not at whether
  # it is used. Delete it if an assurance level of BIOMETRIC is withdrawn, or
  # if Atlassian ever delegates publickey-credentials-get to app frames.
  external:
    fetch:
      client:
        - address: "*"
  scopes:
    - storage:app
    - read:jira-work
    - write:jira-work
    - read:jira-user
    - manage:jira-configuration
    - read:confluence-content.all
    - read:confluence-content.summary
    - write:confluence-content
    - read:confluence-space.summary
    - read:confluence-user
    - read:confluence-props
    - write:confluence-props
    - write:confluence-space
    # THE EVIDENCE VAULT (src/lib/vaultConfluence.js). The v2 create-space
    # endpoint accepts only the granular write:space:confluence — without it
    # Confluence answered every provisioning attempt with 401. Pages go through
    # v2 (write/read:page), attachments through the v1 child/attachment
    # endpoint (write:confluence-file, or its granular pair).
    - read:space:confluence
    - write:space:confluence
    - read:page:confluence
    - write:page:confluence
    - read:content-details:confluence
    - write:attachment:confluence
    - write:confluence-file
    # A rejection puts a removed file back by downloading its vaulted copy
    # (lib/vaultConfluence.js downloadVaultAttachment). The v1 download
    # endpoint needs this with read:content-details:confluence (above). Forge
    # does not accept the classic read:confluence-file.
    - read:attachment:confluence
  content:
    styles: [ unsafe-inline ]
