<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VAtlassian Device Check</title>
    <script>
      // Top-level ceremony popup runs outside Jira's iframe sandbox.
      // Shim __bridge so any @forge/bridge evaluation never throws.
      if (typeof window !== 'undefined' && !window.__bridge) {
        window.__bridge = {
          callBridge: function() { return Promise.resolve({}); }
        };
      }
      window.addEventListener('error', function(event) {
        console.error('WebAuthn popup unhandled error:', event.error || event.message);
        var root = document.getElementById('root');
        if (root && !root.hasChildNodes()) {
          var container = document.createElement('div');
          container.style.cssText = 'padding:24px;font-family:-apple-system,BlinkMacSystemFont,sans-serif;color:#ae2e24;';
          var heading = document.createElement('h3');
          heading.style.cssText = 'margin:0 0 8px;';
          heading.textContent = 'Device check error';
          var message = document.createElement('p');
          message.style.cssText = 'margin:0;font-size:13px;';
          message.textContent = event.message || 'An error occurred.';
          container.appendChild(heading);
          container.appendChild(message);
          root.appendChild(container);
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/popup/main.tsx"></script>
  </body>
</html>
